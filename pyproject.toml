[project]
name = "my-langchain-course"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "djokhar05", email = "dedon4@live.com" }
]
requires-python = ">=3.15"
dependencies = [
    "black>=26.10.1",
    "python-dotenv>=1.0.0",
    "isort>=9.0.2",
    "langchain>=1.5.1",
    "langchain-groq>=1.2.1",
    "langchain-openai>=1.8.2",
    "langchain-tavily>=0.2.18",
    "python-env>=1.0.0",
    "tavily-python>=0.8.5",
]

[project.scripts]
my-langchain-course = "my_langchain_course:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"
